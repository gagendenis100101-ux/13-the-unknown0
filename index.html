<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050506">
<title>13 — THE UNKNOWN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030304;color:#eee;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#intro{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s}#intro.shake{animation:shake .12s infinite}#num{font-family:Georgia,serif;font-size:min(48vw,280px);font-weight:bold;color:#a20d12;text-shadow:0 0 10px #f11,0 0 40px #900,0 0 100px #500;opacity:0;transform:scale(.7);transition:all 2s;letter-spacing:-.08em}#num.show{opacity:1;transform:scale(1)}#subtitle{color:#7d7777;letter-spacing:.45em;font-size:11px;margin-top:-12px}#start{margin-top:45px;background:transparent;border:1px solid #702126;color:#ddd;padding:14px 30px;letter-spacing:.22em;font-size:12px}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}.brand{position:absolute;top:15px;left:16px;color:#b8a6a6;font:12px Georgia;letter-spacing:.25em;text-shadow:0 0 10px #900}.hint{position:absolute;top:45px;left:16px;color:#999;font-size:11px}.cross{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid #bba6a6;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}.prompt{position:absolute;left:50%;top:57%;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:#d4c7c7;background:#080606aa;padding:8px 12px;border:1px solid #513033;white-space:nowrap}.controls{position:absolute;bottom:18px;left:18px;width:118px;height:118px;border:1px solid #ffffff35;border-radius:50%;background:#ffffff08;pointer-events:auto}.stick{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#a32a2a66;border:1px solid #e8b4b466}.looknote{position:absolute;bottom:26px;right:18px;color:#aaa;font-size:10px;text-align:right}.action{position:absolute;right:20px;bottom:90px;pointer-events:auto;border:1px solid #7c3333;background:#17090bcc;color:#eee;padding:13px 16px;font-size:10px;letter-spacing:.12em}.topbtn{position:absolute;right:15px;top:14px;pointer-events:auto;border:1px solid #ffffff33;background:#080808aa;color:#ddd;padding:8px 10px;font-size:10px}.toast{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);background:#090606dd;border:1px solid #633;color:#eee;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .3s}.toast.on{opacity:1}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-3px,4px)}75%{transform:translate(3px,2px)}100%{transform:translate(-4px,-2px)}}
</style></head><body>
<div id="intro"><div id="num">13</div><div id="subtitle">THE UNKNOWN</div><button id="start">ВОЙТИ</button></div>
<div id="hud"><div class="brand">13 / THE UNKNOWN</div><div class="hint">КОМНАТА РИТУАЛОВ · ПРОТОТИП</div><div class="cross"></div><div class="prompt" id="prompt">Осмотритесь. Подойдите к столу.</div><div class="controls" id="pad"><div class="stick" id="stick"></div></div><div class="looknote">ПРАВАЯ ЧАСТЬ ЭКРАНА<br>ПОВОРОТ КАМЕРЫ</div><button class="action" id="act">ВЗЯТЬ / БРОСИТЬ КОСТИ</button><button class="topbtn" id="sound">ЗВУК: ВКЛ</button><div class="toast" id="toast"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050506);scene.fog=new THREE.FogExp2(0x080708,.045);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);camera.position.set(0,1.65,4.7);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x606070,0x17100d,.55));const moon=new THREE.DirectionalLight(0x53617b,.55);moon.position.set(-4,7,4);moon.castShadow=true;scene.add(moon);
const warm=new THREE.PointLight(0xff762e,3.1,9,2);warm.position.set(0,2.2,0);scene.add(warm);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const wood=mat(0x34231b),darkwood=mat(0x1b1210),wall=mat(0x242122),floorMat=mat(0x171516),metal=mat(0x51483f,.45,.65),wax=mat(0xb4a28a),boneMat=mat(0xd4c8aa);
function box(w,h,d,material,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
box(10,.2,10,floorMat,0,-.12,0);box(10,4,.2,wall,0,2,-5);box(10,4,.2,wall,0,2,5);box(.2,4,10,wall,-5,2,0);box(.2,4,10,wall,5,2,0);box(10,.2,10,darkwood,0,4.05,0);
// wall ribs and worn beams
for(let x=-4.5;x<=4.5;x+=1.5){box(.08,3.8,.12,darkwood,x,2,-4.86);box(.08,3.8,.12,darkwood,x,2,4.86)}
// ritual table
box(2.5,.16,1.5,wood,0,1.05,-.6);for(const x of [-1.08,1.08])for(const z of [-1.18,-.02])box(.14,1,.14,darkwood,x,.52,z-.6);
// old book
const book=box(.62,.09,.48,mat(0x321316),-.55,1.18,-.55);book.rotation.y=-.16;
// candles
const flames=[];for(const [x,z] of [[-.85,-.9],[.8,-.85],[.15,-.15]]){let c=new THREE.Mesh(new THREE.CylinderGeometry(.055,.065,.28,12),wax);c.position.set(x,1.27,z);scene.add(c);let f=new THREE.Mesh(new THREE.SphereGeometry(.045,10,10),new THREE.MeshBasicMaterial({color:0xff9b36}));f.position.set(x,1.45,z);scene.add(f);let l=new THREE.PointLight(0xff9a43,1.25,3);l.position.set(x,1.55,z);scene.add(l);flames.push({f,l})}
// bones dice are simple ivory cubes with dots
function makeDie(x,z){let g=new THREE.Group();let cube=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.22),boneMat);cube.castShadow=true;g.add(cube);for(let i=0;i<6;i++){let dot=new THREE.Mesh(new THREE.SphereGeometry(.018,8,8),mat(0x382b24));dot.position.set((i%3-1)*.045,.112,((i/3|0)-.5)*.06);g.add(dot)}g.position.set(x,1.23,z);scene.add(g);return g}
const dice=[makeDie(-.15,-.65),makeDie(.2,-.55)];let carried=false,started=false,muted=false;let yaw=0,pitch=0,move={x:0,y:0};const ray=new THREE.Raycaster();
const intro=document.getElementById('intro'),num=document.getElementById('num'),hud=document.getElementById('hud'),prompt=document.getElementById('prompt'),toast=document.getElementById('toast');
function say(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)}
let audioCtx;function tone(freq,dur,type='sine',gain=.05){if(muted)return;try{audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch{}}
document.getElementById('start').onclick=()=>{if(started)return;started=true;audioCtx=new AudioContext();intro.classList.add('shake');tone(48,1.2,'sawtooth',.12);setTimeout(()=>{intro.classList.remove('shake');intro.style.background='#000';tone(65,1.4,'sine',.08)},900);setTimeout(()=>num.classList.add('show'),1600);setTimeout(()=>{tone(110,1.1,'triangle',.07);say('…ТЫ ВОШЁЛ…')},3500);setTimeout(()=>{intro.style.opacity='0';hud.style.display='block';setTimeout(()=>intro.remove(),1100)},5900)};
// joystick touch
const pad=document.getElementById('pad'),stick=document.getElementById('stick');let padId=null;pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(padId);joy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)joy(e)});function joy(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),k=Math.min(1,42/(len||1));move.x=dx*k/42;move.y=dy*k/42;stick.style.transform=`translate(${move.x*35}px,${move.y*35}px)`}function endJoy(e){if(e.pointerId===padId){padId=null;move={x:0,y:0};stick.style.transform=''}}pad.addEventListener('pointerup',endJoy);pad.addEventListener('pointercancel',endJoy);
// drag right side to look
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(lookId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId){yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.003;pitch=THREE.MathUtils.clamp(pitch,-1.1,1.1);lastX=e.clientX;lastY=e.clientY;camera.rotation.set(pitch,yaw,0)}});renderer.domElement.addEventListener('pointerup',()=>lookId=null);
function interact(){let forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion),origin=camera.position.clone();ray.set(origin,forward);let hits=ray.intersectObjects(dice,true);if(carried){carried=false;dice.forEach((d,i)=>{d.position.copy(camera.position).add(forward.clone().multiplyScalar(1.5+i*.24));d.position.y=Math.max(1.15,d.position.y);d.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);d.userData.v=forward.clone().multiplyScalar(3.5+Math.random()*2);});say('Кости брошены');tone(90,.35,'square',.08);return}if(hits.length&&hits[0].distance<3){carried=true;say('Кости в руках. Нажми ещё раз, чтобы бросить.');tone(180,.18,'triangle',.05)}else say('Подойди ближе к костям на столе');}
document.getElementById('act').onclick=interact;document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'ЗВУК: ВЫКЛ':'ЗВУК: ВКЛ';if(!muted)tone(220,.15)};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(started){let dir=new THREE.Vector3(move.x,0,-move.y).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,dt*2.2);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-4.4,4.4);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-4.4,4.4);if(carried){dice.forEach((d,i)=>{let f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);d.position.copy(camera.position).add(f.multiplyScalar(1.05+i*.22));d.position.y-=.18})}dice.forEach(d=>{if(d.userData.v){d.position.addScaledVector(d.userData.v,dt);d.userData.v.multiplyScalar(.94);d.rotation.x+=dt*5;d.rotation.z+=dt*4;if(d.position.y<1.2){d.position.y=1.2;d.userData.v.y=Math.abs(d.userData.v.y)*.35;if(d.userData.v.length()<.25)d.userData.v=null}}});flames.forEach((a,i)=>{a.f.scale.y=.8+Math.sin(performance.now()*.01+i)*.18;a.l.intensity=1.1+Math.sin(performance.now()*.012+i*3)*.22});let fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);ray.set(camera.position,fwd);let h=ray.intersectObjects(dice,true);prompt.textContent=h.length&&h[0].distance<3?'Кости — нажми «ВЗЯТЬ / БРОСИТЬ КОСТИ»':'Осмотрись и найди кости на столе'} }renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
